<!-- assets/achievement-ribbons.svg -->
<svg width="100%" height="120" viewBox="0 0 800 120" xmlns="http://www.w3.org/2000/svg">
  <style>
    .ribbon { animation: float 3s ease-in-out infinite alternate; }
    .ribbon-1 { animation-delay: 0s; fill: #58A6FF; }
    .ribbon-2 { animation-delay: 0.5s; fill: #1F6FEB; }
    .ribbon-3 { animation-delay: 1s; fill: #FFD33D; }
    @keyframes float {
      0% { transform: translateY(0); }
      100% { transform: translateY(-5px); }
    }
  </style>
  
  <!-- Ribbon 1 - First Place -->
  <path class="ribbon ribbon-1" d="M50,20 L150,20 L180,60 L150,100 L50,100 L20,60 Z">
    <text x="100" y="70" font-family="Arial" font-size="16" fill="white" text-anchor="middle">AI CHAMPION</text>
  </path>
  
  <!-- Ribbon 2 - Second Place -->
  <path class="ribbon ribbon-2" d="M250,30 L350,30 L380,70 L350,110 L250,110 L220,70 Z">
    <text x="300" y="80" font-family="Arial" font-size="14" fill="white" text-anchor="middle">HACK WIZARD</text>
  </path>
  
  <!-- Ribbon 3 - Third Place -->
  <path class="ribbon ribbon-3" d="M450,40 L550,40 L580,80 L550,120 L450,120 L420,80 Z">
    <text x="500" y="90" font-family="Arial" font-size="12" fill="#0d1117" text-anchor="middle">CODE ARTIST</text>
  </path>
  
  <!-- Floating Stars -->
  <circle cx="650" cy="40" r="5" fill="#FFD33D">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="60" r="4" fill="#FFD33D">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
