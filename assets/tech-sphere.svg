<!-- /assets/tech-sphere.svg -->
<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    .orbit { 
      animation: spin 15s linear infinite;
      transform-origin: 50% 50%;
    }
    @keyframes spin { 
      100% { transform: rotate(360deg); } 
    }
    .icon {
      width: 24px;
      height: 24px;
    }
  </style>
  
  <!-- Background Sphere -->
  <circle cx="150" cy="150" r="140" fill="#0d1117" stroke="#58A6FF" stroke-width="2"/>
  
  <!-- Visible Orbiting Icons -->
  <g class="orbit">
    <!-- Python -->
    <image xlink:href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg" x="50" y="50" class="icon"/>
    <!-- JavaScript -->
    <image xlink:href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/javascript/javascript-original.svg" x="250" y="80" class="icon"/>
    <!-- TensorFlow -->
    <image xlink:href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/tensorflow/tensorflow-original.svg" x="220" y="250" class="icon"/>
  </g>
  
  <!-- Center Text -->
  <text x="150" y="160" font-size="20" fill="#58A6FF" text-anchor="middle" font-family="Arial">TECH SPHERE</text>
</svg>
