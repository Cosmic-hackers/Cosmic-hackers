<svg width="250" height="250" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    .gear { fill: #58A6FF; animation: spin 6s linear infinite; transform-origin: 50% 50%; }
    .hex { fill: #1F6FEB; opacity: 0.7; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
  
  <!-- Cyber Mandala Base -->
  <circle cx="50" cy="50" r="45" fill="#0d1117" stroke="#58A6FF" stroke-width="0.5"/>
  
  <!-- Animated Gears -->
  <path class="gear" d="M30,50 L35,45 L40,50 L45,45 L50,50 L45,55 L40,50 L35,55 Z"/>
  <path class="gear" d="M50,30 L55,35 L50,40 L55,45 L50,50 L45,45 L50,40 L45,35 Z" style="animation-delay: 3s"/>
  
  <!-- Hexagonal Pattern -->
  <path class="hex" d="M50,20 L60,25 L60,35 L50,40 L40,35 L40,25 Z"/>
  <path class="hex" d="M70,40 L80,45 L80,55 L70,60 L60,55 L60,45 Z" opacity="0.5"/>
</svg>
